<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C93A82">
<title>Татына</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6F9;--surface:#fff;--ink:#3A2347;--muted:#7A6585;--accent:#C93A82;--on-accent:#fff;--line:#F2D9E4;--mint:#FFE3EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241628;--surface:#30203A;--ink:#FBEFF5;--muted:#C4A9CF;--accent:#F27AB4;--on-accent:#3A0F26;--line:#4A3357;--mint:#4A2B3F;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{padding:16px 16px 8px;max-width:640px;margin:0 auto;text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.logo{width:min(300px,80%);height:auto;display:block;margin:0 auto}
h1{font:600 30px/1.1 Unbounded,Onest,system-ui,sans-serif;margin:0;letter-spacing:-.5px}
header p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:640px;margin:0 auto}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;font:500 14px Onest,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic img{width:86%;height:86%;object-fit:contain}.pic{aspect-ratio:1;display:grid;place-items:center;font-size:56px;background:var(--mint)}
.card:nth-child(3n+2) .pic{background:#E8E0FA}
.card:nth-child(3n) .pic{background:#FFF0C9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card .pic{filter:brightness(.8)}}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:500;font-size:15px}
.price{color:var(--muted);font-size:14px}
button{font-family:inherit}
.add{margin-top:auto;border:0;background:var(--accent);color:var(--on-accent);padding:10px;border-radius:10px;font:500 14px Onest,system-ui,sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.cartbtn{display:flex;justify-content:space-between;width:100%;max-width:608px;margin:0 auto;border:0;background:var(--accent);color:var(--on-accent);padding:14px 18px;border-radius:14px;font:500 16px Onest,system-ui,sans-serif;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(10,8,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}a.cartbtn{text-decoration:none;justify-content:center}a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{font:600 20px Unbounded,Onest,sans-serif;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}.row .t small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:14px 0}
input{width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px Onest,system-ui,sans-serif}
.ghost{background:none;border:0;color:var(--muted);padding:10px;width:100%;cursor:pointer;font-size:15px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
</style>
</head>

function bar(){var t=totals();document.getElementById("sum").textContent=t.n?tot(t):"";document.querySelector(".cartbtn span").textContent="Корзина"+(t.n?" · "+t.n:"")}
function panel(){var t=totals(),h='<h2>Корзина</h2>';
if(!t.n){h+='<div class="empty">Здесь пока пусто. Добавьте что-нибудь из каталога.</div><button class="ghost" data-x="close">Закрыть</button>'}
else{for(var k in cart){var p=find(k);if(!p)continue;h+='<div class="row"><div style="font-size:28px">'+(p.img?'<img src="'+p.img+'" alt="" style="width:44px;height:44px;object-fit:contain;display:block">':p.e)+'</div><div class="t">'+p.n+'<small>'+(p.p==null?'Цена скоро':money(p.p))+'</small></div><div class="qty"><button data-m="'+k+'" aria-label="Меньше">−</button><span>'+cart[k]+'</span><button data-a="'+k+'" aria-label="Больше">+</button></div></div>'}
h+='<div class="total"><span>Итого</span><span>'+tot(t)+'</span></div><input id="nm" placeholder="Ваше имя" autocomplete="name"><input id="ph" type="tel" placeholder="Телефон" autocomplete="tel"><button class="cartbtn" data-x="order" style="max-width:none"><span>Оформить заказ</span><span></span></button><button class="ghost" data-x="close">Продолжить покупки</button>'}
document.getElementById("panel").innerHTML=h}
function done(name,phone){var num=Math.floor(1000+Math.random()*9000),L=[],t=totals(),i=0;for(var k in cart){var p=find(k);if(!p)continue;i++;L.push(i+". "+p.n+" ("+p.t+") × "+cart[k]+(p.p==null?"":" — "+money(p.p*cart[k]))+"\n   Фото: "+BASE+"#tovar-"+p.id)}var msg="Новый заказ №"+num+"\nИмя: "+name+"\nТелефон: "+phone+"\n\n"+L.join("\n")+"\n\nИтого: "+(t.u?"цену уточним":money(t.t));var link="https://wa.me/996778469294?text="+encodeURIComponent(msg);cart={};save();bar();
document.getElementById("panel").innerHTML='<h2>Заказ №'+num+' готов</h2><p>Осталось отправить его магазину: нажмите кнопку, а в WhatsApp нажмите «Отправить».</p><a class="cartbtn" href="'+link+'" target="_blank" rel="noopener"><span>Отправить в WhatsApp</span></a><button class="ghost" data-x="close">Вернуться в каталог</button>'}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.c){cat=b.dataset.c;chips();grid();return}
if(b.dataset.a){cart[b.dataset.a]=(cart[b.dataset.a]||0)+1;save();bar();if(document.getElementById("sheet").classList.contains("open"))panel();return}
if(b.dataset.m){var k=b.dataset.m;cart[k]--;if(cart[k]<=0)delete cart[k];save();bar();panel();return}
if(b.id=="open"){panel();document.getElementById("sheet").classList.add("open");return}
if(b.dataset.x=="close"){document.getElementById("sheet").classList.remove("open");return}
if(b.dataset.x=="order"){var n=document.getElementById("nm"),p=document.getElementById("ph");if(!n.value.trim()||p.value.replace(/\D/g,"").length<6){(n.value.trim()?p:n).focus();return}done(n.value.trim(),p.value.trim())}});
document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id=="sheet")e.target.classList.remove("open")});
function view(){var m=/^#tovar-(\d+)$/.exec(location.hash),p=m&&find(m[1]);if(!p)return;document.getElementById("panel").innerHTML='<div class="pic" style="border-radius:14px;max-width:320px;margin:0 auto">'+(p.img?'<img src="'+p.img+'" alt="'+p.n+'">':p.e)+'</div><h2 style="margin-top:12px">'+p.n+'</h2><p>'+(p.p==null?'Цена скоро':money(p.p))+'</p><button class="cartbtn" data-a="'+p.id+'" style="max-width:none"><span>Добавить в корзину</span><span></span></button><button class="ghost" data-x="close">Закрыть</button>';document.getElementById("sheet").classList.add("open")}
window.addEventListener("hashchange",view);
chips();grid();bar();view();
</script>
</body>
</html>
